# M10 packaging on CI: runs scripts/package.sh (all five artifact families,
# container-native) and attaches dist/ to the workflow. On a v* tag push it
# also creates a GitHub Release with the artifacts.
#
# Version guard: the pushed tag must equal the CMake project VERSION
# (single source of truth, see ROADMAP §0 #6).

name: Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version guard (tag vs project VERSION)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          VER=$(sed -n 's/^project(bootroll VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "tag=v$TAG project=$VER"
          [ "$TAG" = "$VER" ] || { echo "TAG MISMATCH: tag v$TAG vs project $VER"; exit 1; }

      - name: Build all artifacts (containers)
        run: |
          ./scripts/package.sh all

      - name: Upload artifacts (workflow attachment)
        uses: actions/upload-artifact@v4
        with:
          name: bootroll-dist
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
